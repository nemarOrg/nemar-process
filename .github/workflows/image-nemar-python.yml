name: image-nemar-python

# The nemar-python runtime image in two flavors, `cpu` and `cuda` (a matrix in the test, publish and
# sign jobs): built from the root lock, smoke-tested as a container image (the CPU flavor also as a
# Singularity Image Format (SIF) file under Apptainer), and, on a version tag or a manual dispatch from
# main, pushed to GHCR, smoke-tested again by digest, signed with cosign (keyless), recorded in a
# release asset per flavor. The CPU flavor is also turned into a SIF from its digest, pushed again as an
# OCI artifact and signed again; the CUDA flavor publishes no SIF (none exists, and the runner refuses
# one built by hand), so it runs under Docker or Podman by its verified digest.
#
#   pull request              the `test` job only: build both flavors without pushing, smoke test.
#                             No job that pushes, signs or releases runs on a pull request.
#   tag image-nemar-python-v* the whole chain, but only for a commit that is reachable from main:
#                             the first step of `publish` fails otherwise. The first publication
#                             therefore happens from main, after this file has been merged.
#   workflow_dispatch         the same chain, from main only, with the version as an input.
#
# What the guard is: a check in this file, at the tagged commit. It stops a mistaken tag. It does
# not stop someone who can push a tag and edit this file in the same commit; that is what a tag
# ruleset on `image-nemar-python-v*`, branch protection on main, or an environment with required
# reviewers can do, and they are the repository owner's (docs/images.md, "What is not verified").
#
# docs/images.md says how a consumer references and verifies what this publishes.

on:
  pull_request:
    paths:
      - ".github/workflows/image-nemar-python.yml"
      - "images/nemar-python/**"
      - "recipes/**"
      - "launcher/**"
      - "tests/e2e/**"
      - "tests/harness.py"
      - "tests/standin/**"
      - "tests/fixtures/eeg/**"
      - "scripts/check_smoke_pins.py"
      - "scripts/check_image_build.py"
      - "scripts/check_tag_absent.py"
      - "scripts/make_image_digests.py"
      - "tests/fixtures/smoke/**"
      - ".dockerignore"
      - ".python-version"
      - "pyproject.toml"
      - "uv.lock"
  push:
    tags: ["image-nemar-python-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Image version as MAJOR.MINOR.PATCH; the tags are <version>-cpu and <version>-cuda"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: image-nemar-python-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The same pins as ci.yml, bumped together (tests/images/test_workflow.py compares them).
  APPTAINER_VERSION: "1.5.5"
  APPTAINER_DEB_SHA256: "25095d3711504b3e8657dbb2e172ef8db9db43c4503d940c9c36b105db8dce77"
  UV_VERSION: "0.13.4"
  # What a signature must say about who made it: this workflow, from a version tag or from main.
  SIGNING_IDENTITY: '^https://github\.com/nemarOrg/nemar-process/\.github/workflows/image-nemar-python\.yml@refs/(tags/image-nemar-python-v[0-9]+\.[0-9]+\.[0-9]+|heads/main)$'

jobs:
  test:
    name: build and smoke test (${{ matrix.flavor }})
    runs-on: ubuntu-24.04
    # The full-length nemar-ica run (a pull request into main, the tag, the dispatch) fits pAMICA at the
    # recipe's 4000 iterations: the last full run (2000 iterations) took 25.8 minutes, 15.7 of them in the
    # fits, so doubling pAMICA's share bounds the job near 42 minutes; 90 leaves room on a slow runner.
    timeout-minutes: 90
    # One leg per flavor; a flavor that fails does not stop the other from reporting. The CUDA flavor
    # has no GitHub Actions cache: its layers are several gigabytes and would push the CPU flavor's
    # (and the repository's other caches) out of the 10 GB the repository gets.
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: cpu
            dockerfile: images/nemar-python/Dockerfile
            cache_from: type=gha,scope=nemar-python-cpu
            cache_to: type=gha,scope=nemar-python-cpu,mode=max
          - flavor: cuda
            dockerfile: images/nemar-python/Dockerfile.cuda
            cache_from: ""
            cache_to: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space for the CUDA build
        if: matrix.flavor == 'cuda'
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Hash the lock
        id: lock
        run: echo "sha256=$(sha256sum uv.lock | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # The image built here is never published, so it is a dev build whatever the version file says:
      # a release version gets the suffix -dev0, one already ending in -devN is kept, anything else is
      # refused here (the Dockerfile would refuse it too), and the test below reads it from a record.
      - name: Name the dev build
        id: devbuild
        run: |
          set -euo pipefail
          base="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          case "$base" in
            *-dev[0-9]*) version="$base" ;;
            *) version="${base}-dev0" ;;
          esac
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-dev[0-9]+$ ]]; then
            echo "::error::pyproject.toml has a version that is neither X.Y.Z nor X.Y.Z-devN"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build the image (nothing is pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          load: true
          tags: nemar-python:ci
          build-args: |
            NEMAR_PROCESS_VERSION=${{ steps.devbuild.outputs.version }}
            NEMAR_PROCESS_COMMIT=${{ github.sha }}
            NEMAR_PROCESS_BUILD=dev
            LOCK_SHA256=${{ steps.lock.outputs.sha256 }}
          cache-from: ${{ matrix.cache_from }}
          cache-to: ${{ matrix.cache_to }}

      - name: Smoke test the container image (cpu)
        if: matrix.flavor == 'cpu'
        run: |
          set -euo pipefail
          docker run --rm nemar-python:ci python /opt/smoke.py > smoke-container.json
          python3 scripts/check_smoke_pins.py --image --flavor cpu smoke-container.json

      # The way a job the runner kept off the GPU runs: no GPU is visible (a hosted runner has none,
      # and the variable says so to the container runtime), so torch.cuda.is_available() is false and
      # the CPU engine must run, in the CUDA image, correctly. The document is checked for exactly that.
      - name: Smoke test the container image (cuda, no GPU visible)
        if: matrix.flavor == 'cuda'
        run: |
          set -euo pipefail
          docker run --rm --env NVIDIA_VISIBLE_DEVICES=void nemar-python:ci python /opt/smoke.py --no-gpu > smoke-container.json
          python3 scripts/check_smoke_pins.py --image --flavor cuda --no-gpu smoke-container.json

      # nemar-ica, from the image and by the path the registry uses (the CUDA flavor is the one it runs
      # from): one tiny pAMICA run on the fixture with no GPU visible, as a job the runner kept off
      # the GPU. The record must say the CPU ran, why, that it was a fallback, which flavor the image
      # is and which torch it ran with (docs/recipes.md); the device is never in the engine stamp.
      - name: Run nemar-ica on the fixture (cuda, no GPU visible)
        if: matrix.flavor == 'cuda'
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/ica-cuda"
          mkdir -p "$out"
          chmod 0777 "$out"
          docker run --rm --env NVIDIA_VISIBLE_DEVICES=void \
            --volume "$PWD/tests/fixtures/eeg/dataset:/dataset:ro" \
            --volume "$out:/out" \
            nemar-python:ci nemar-recipe run nemar-ica \
              --dataset-dir /dataset --out /out/product \
              --dataset-id on007823 --dataset-version v1.0.0 --ica-max-iter 5
          python3 - "$out/product" <<'PY'
          import json
          import pathlib
          import sys

          product = pathlib.Path(sys.argv[1])
          (record,) = product.rglob("*_desc-nemarica_signalJourney.json")
          nemar = json.loads(record.read_text(encoding="utf-8"))["extensions"]["nemar"]
          expected = {
              "engine": "pamica-torch",
              "device_requested": "auto",
              "device": "cpu",
              "device_reason": "no_gpu",
              "fallback": True,
              "image_flavor": "cuda",
              "torch_version": "2.12.1+cu129",
          }
          found = {key: nemar["ica"][key] for key in expected}
          print("nemar-ica record:", found)
          if found != expected or "device" in nemar["engine"]:
              sys.exit("the record of a CUDA image with no GPU is not the CPU fallback it must be")
          PY

      - name: Report the image size and the smoke readings
        env:
          FLAVOR: ${{ matrix.flavor }}
        run: |
          set -euo pipefail
          echo "image size (${FLAVOR}): $(docker image inspect --format '{{ .Size }}' nemar-python:ci) bytes"
          python3 -c 'import json, sys; d = json.load(open(sys.argv[1])); print("flavor", d["flavor"], "torch", d["torch"]["version"], "cuda", d["torch"]["cuda"], "arch_list", d["torch"]["arch_list"], "amica15", d["amica15"]["sha256"], "CPUFIT", d["cpu_fit"]["sha256"])' smoke-container.json

      - name: Check the labels against the lock and the commit
        env:
          LOCK_SHA256: ${{ steps.lock.outputs.sha256 }}
          FLAVOR: ${{ matrix.flavor }}
        run: |
          set -euo pipefail
          label() { docker inspect --format "{{ index .Config.Labels \"${1}\" }}" nemar-python:ci; }
          test "$(label io.nemar.lock-sha256)" = "$LOCK_SHA256"
          test "$(label org.opencontainers.image.revision)" = "$GITHUB_SHA"
          test "$(label io.nemar.flavor)" = "$FLAVOR"

      # The image's own build record, read as the sign job reads a pushed digest's: the build file
      # and the version, revision and build labels must say the dev build named above (its version,
      # this commit, `dev`). Both flavors run it on every pull request, so a change that breaks the
      # mirror fails a pull request, not a release (docs/images.md, "The build a record names").
      - name: Check the build record and labels against the dev build
        env:
          VERSION: ${{ steps.devbuild.outputs.version }}
        run: |
          set -euo pipefail
          if ! docker run --rm --network none --entrypoint cat nemar-python:ci /opt/nemar/build.json > image-build.json; then
            echo "::error::the build file could not be read from the built image"
            exit 1
          fi
          docker image inspect --format '{{json .Config.Labels}}' nemar-python:ci > image-labels.json
          python3 scripts/check_image_build.py --build dev --version "$VERSION" --commit "$GITHUB_SHA" --labels image-labels.json --build-file image-build.json

      - name: Install Apptainer
        if: matrix.flavor == 'cpu'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL -o apptainer.deb "https://github.com/apptainer/apptainer/releases/download/v${APPTAINER_VERSION}/apptainer_${APPTAINER_VERSION}_amd64.deb"
          echo "${APPTAINER_DEB_SHA256}  apptainer.deb" | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y ./apptainer.deb
          apptainer --version

      - name: Build a SIF from the local image
        if: matrix.flavor == 'cpu'
        run: |
          set -euo pipefail
          docker save nemar-python:ci --output nemar-python.tar
          apptainer build nemar-python.sif docker-archive:nemar-python.tar

      - name: Smoke test the SIF under Apptainer, isolated as the launcher runs it
        if: matrix.flavor == 'cpu'
        run: |
          set -euo pipefail
          apptainer exec --containall --cleanenv --no-home --no-mount bind-paths nemar-python.sif python /opt/smoke.py > smoke-sif.json
          python3 scripts/check_smoke_pins.py --image --flavor cpu smoke-sif.json

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: matrix.flavor == 'cpu'
        with:
          version: ${{ env.UV_VERSION }}

      # The launch end to end (docs/recipes.md): the real launcher stages the fixture from a stand-in
      # data plane, runs `nemar-recipe run nemar-floor` in this SIF as it runs a job, and uploads to
      # stand-in outputs routes. The test needs the runtime environment to compare the result with a
      # direct run of the same fixture. The same step runs tests/e2e/test_ica_launch.py (every test
      # of tests/e2e with the `apptainer` marker): nemar-ica in this SIF with pAMICA and with the
      # image's AMICA binary on the fixture, and checks that two runs of the unseeded binary are not
      # byte identical. nemar-ica runs at a short length (every run 50 iterations, no E1R line) on a
      # pull request into any branch but main, and at the full length (2000 iterations, the
      # informational E1R line) on a pull request into main, on the image tag and on the dispatch,
      # where `publish` needs this job. The length comes from the event and the base branch alone,
      # never from a label, a title or the head branch's name (docs/images.md).
      - name: Run the floor through the launcher, and nemar-ica, in the SIF
        if: matrix.flavor == 'cpu'
        env:
          NEMAR_REQUIRE_APPTAINER: "1"
          NEMAR_REQUIRE_RECIPE_SIF: "1"
          NEMAR_REQUIRE_RUNTIME: "1"
          NEMAR_RECIPE_SIF: ${{ github.workspace }}/nemar-python.sif
          NEMAR_ICA_E2E_LENGTH: ${{ github.event_name == 'pull_request' && github.base_ref != 'main' && 'short' || 'full' }}
        run: uv run --frozen --group runtime --extra cpu pytest tests/e2e -m apptainer -v

  publish:
    name: push the ${{ matrix.flavor }} image to GHCR
    needs: test
    if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/image-nemar-python-v') || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    # One leg per flavor, both behind the same guards below: a leg that fails does not stop the other,
    # and "Re-run failed jobs" runs only the leg that failed. Every leg writes the output of its own
    # flavor and leaves the other empty, which the run keeps from the leg that set it (the pattern the
    # GitHub documentation gives for matrix outputs).
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: cpu
            dockerfile: images/nemar-python/Dockerfile
            cache_from: type=gha,scope=nemar-python-cpu
          - flavor: cuda
            dockerfile: images/nemar-python/Dockerfile.cuda
            cache_from: ""
    outputs:
      version: ${{ steps.version.outputs.version }}
      digest_cpu: ${{ matrix.flavor == 'cpu' && steps.build.outputs.digest || '' }}
      digest_cuda: ${{ matrix.flavor == 'cuda' && steps.build.outputs.digest || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the whole history, so that main is there to compare with

      # A tag can be pushed on any commit by anyone who can write to the repository, and the signature
      # a tag run gets names only this workflow and the tag. Only a commit of main is published.
      - name: Refuse a commit that is not on main
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_SHA} is not reachable from main: only a commit of main is published"
            exit 1
          fi

      # The image tag, the git tag vX.Y.Z and the version every record names are one version: the
      # version asked for must be the one pyproject.toml has at this commit, a release (no -devN), and
      # the tag vX.Y.Z must exist and point at this commit. To publish X.Y.Z after main has moved past
      # vX.Y.Z, push image-nemar-python-vX.Y.Z on the vX.Y.Z commit (docs/images.md).
      - name: Read the version from the tag or the dispatch input
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = "tag" ]; then
            version="${REF_NAME#image-nemar-python-v}"
          else
            version="$INPUT_VERSION"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::the version must be MAJOR.MINOR.PATCH, got '${version}'"
            exit 1
          fi
          project="$(git show "${GITHUB_SHA}:pyproject.toml" | python3 -c 'import sys, tomllib; print(tomllib.loads(sys.stdin.read())["project"]["version"])')"
          if [[ "$project" == *-dev* ]]; then
            echo "::error::pyproject.toml has the dev version '${project}' at ${GITHUB_SHA}: only a release is published"
            exit 1
          fi
          if [ "$project" != "$version" ]; then
            echo "::error::the version asked for is '${version}' and pyproject.toml has '${project}' at ${GITHUB_SHA}"
            exit 1
          fi
          tagged="$(git rev-parse --verify --quiet "refs/tags/v${version}^{commit}" || true)"
          if [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::error::the git tag v${version} must exist and point at ${GITHUB_SHA}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Free disk space for the CUDA build
        if: matrix.flavor == 'cuda'
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Hash the lock
        id: lock
        run: echo "sha256=$(sha256sum uv.lock | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # A version is published once: the tags <version>-cpu and <version>-cuda are never moved to a
      # new image. Only a manifest HEAD answered with exactly 404 lets the run go on; any other reply
      # stops it.
      - name: Refuse to overwrite an existing version tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          FLAVOR: ${{ matrix.flavor }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/check_tag_absent.py nemarorg/nemar-python "${VERSION}-${FLAVOR}"

      # No provenance or SBOM attestation: either would make the pushed manifest an index, and the
      # digest every consumer pins is then the index's, not the image's.
      - name: Build and push the image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/nemarorg/nemar-python:${{ steps.version.outputs.version }}-${{ matrix.flavor }}
          build-args: |
            NEMAR_PROCESS_VERSION=${{ steps.version.outputs.version }}
            NEMAR_PROCESS_COMMIT=${{ github.sha }}
            NEMAR_PROCESS_BUILD=release
            LOCK_SHA256=${{ steps.lock.outputs.sha256 }}
          cache-from: ${{ matrix.cache_from }}

  sign:
    name: sign the ${{ matrix.flavor }} image (the cpu leg also builds the SIF and signs it)
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # One leg per flavor, each with the digest its own publish leg pushed. A leg that fails does not
    # stop the other.
    strategy:
      fail-fast: false
      matrix:
        flavor: [cpu, cuda]
    # The only job with the OIDC token: cosign keyless exchanges it for a short-lived certificate
    # that names this workflow and ref.
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      VERSION: ${{ needs.publish.outputs.version }}
      FLAVOR: ${{ matrix.flavor }}
      IMAGE_DIGEST: ${{ needs.publish.outputs[format('digest_{0}', matrix.flavor)] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Refuse an empty or malformed image digest
        run: |
          set -euo pipefail
          if ! [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::the ${FLAVOR} publish leg left no image digest: '${IMAGE_DIGEST}'"
            exit 1
          fi

      - name: Free disk space for the CUDA image
        if: matrix.flavor == 'cuda'
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: "v3.1.4"

      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
        with:
          version: "1.3.6"

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The pushed digest passes its smoke test BEFORE it is signed: a signature means this workflow
      # built the image and the image passed, not only that this workflow built it.
      - name: Smoke test the pushed image by digest (container form, cpu)
        if: matrix.flavor == 'cpu'
        run: |
          set -euo pipefail
          docker run --rm "ghcr.io/nemarorg/nemar-python@${IMAGE_DIGEST}" python /opt/smoke.py > smoke-container.json
          python3 scripts/check_smoke_pins.py --image --flavor cpu smoke-container.json

      - name: Smoke test the pushed image by digest (container form, cuda, no GPU visible)
        if: matrix.flavor == 'cuda'
        run: |
          set -euo pipefail
          docker run --rm --env NVIDIA_VISIBLE_DEVICES=void "ghcr.io/nemarorg/nemar-python@${IMAGE_DIGEST}" python /opt/smoke.py --no-gpu > smoke-container.json
          python3 scripts/check_smoke_pins.py --image --flavor cuda --no-gpu smoke-container.json

      # The pushed digest's own record must be the build the publish job was told to make: its build
      # file and its version, revision and build labels say the version the version step read, this
      # run's commit and `release`. A disagreement ends the leg here, before any signature, and a
      # digest's record cannot change, so a re-run cannot pass: the way on is a new version. The
      # reference is the digest, so the daemon holds exactly the content that was smoke tested and is
      # signed below, and the file is read by `cat` in a container with no network, no host environment
      # passed in and no mount. The step has no `if`, no `env` and no credential of its own
      # (docs/images.md, "The build a record names"). It proves nothing about an image built on purpose
      # to lie: the record is the image's own statement.
      - name: Check the pushed digest's build record against the version step
        run: |
          set -euo pipefail
          if ! docker run --rm --network none --entrypoint cat "ghcr.io/nemarorg/nemar-python@${IMAGE_DIGEST}" /opt/nemar/build.json > image-build.json; then
            echo "::error::the build file could not be read from the pushed image"
            exit 1
          fi
          docker image inspect --format '{{json .Config.Labels}}' "ghcr.io/nemarorg/nemar-python@${IMAGE_DIGEST}" > image-labels.json
          python3 scripts/check_image_build.py --build release --version "$VERSION" --commit "$GITHUB_SHA" --labels image-labels.json --build-file image-build.json

      - name: Sign the image digest and verify the signature
        run: |
          set -euo pipefail
          cosign sign --yes "ghcr.io/nemarorg/nemar-python@${IMAGE_DIGEST}"
          cosign verify "ghcr.io/nemarorg/nemar-python@${IMAGE_DIGEST}" \
            --certificate-identity-regexp "$SIGNING_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      - name: Install Apptainer
        if: matrix.flavor == 'cpu'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL -o apptainer.deb "https://github.com/apptainer/apptainer/releases/download/v${APPTAINER_VERSION}/apptainer_${APPTAINER_VERSION}_amd64.deb"
          echo "${APPTAINER_DEB_SHA256}  apptainer.deb" | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y ./apptainer.deb
          apptainer --version

      - name: Build the SIF from the image digest
        if: matrix.flavor == 'cpu'
        env:
          APPTAINER_DOCKER_USERNAME: ${{ github.actor }}
          APPTAINER_DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          apptainer build nemar-python.sif "docker://ghcr.io/nemarorg/nemar-python@${IMAGE_DIGEST}"

      - name: Smoke test the SIF under Apptainer (SIF form)
        if: matrix.flavor == 'cpu'
        run: |
          set -euo pipefail
          apptainer exec --containall --cleanenv --no-home --no-mount bind-paths nemar-python.sif python /opt/smoke.py > smoke-sif.json
          python3 scripts/check_smoke_pins.py --image --flavor cpu smoke-sif.json

      # The same rule for the SIF's tag, which is the image digest.
      - name: Refuse to overwrite an existing SIF tag
        if: matrix.flavor == 'cpu'
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/check_tag_absent.py nemarorg/nemar-python-sif "sha256-${IMAGE_DIGEST#sha256:}"

      # The artifact is tagged with the image digest, because the SIF file is named by it: the launcher
      # looks for <64 hex digits of the image digest>.sif under NEMAR_SIF_ROOT.
      - name: Push the SIF to GHCR as an OCI artifact
        id: push-sif
        if: matrix.flavor == 'cpu'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          hex="${IMAGE_DIGEST#sha256:}"
          echo "$GITHUB_TOKEN" | apptainer registry login --username "$GITHUB_ACTOR" --password-stdin oras://ghcr.io
          apptainer push nemar-python.sif "oras://ghcr.io/nemarorg/nemar-python-sif:sha256-${hex}"
          sif_digest="$(oras manifest fetch --descriptor "ghcr.io/nemarorg/nemar-python-sif:sha256-${hex}" | python3 -c 'import json, sys; print(json.load(sys.stdin)["digest"])')"
          if ! [[ "$sif_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::no SIF digest: ${sif_digest}"
            exit 1
          fi
          echo "digest=${sif_digest}" >> "$GITHUB_OUTPUT"

      - name: Sign the SIF artifact digest and verify the signature
        if: matrix.flavor == 'cpu'
        env:
          SIF_DIGEST: ${{ steps.push-sif.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "ghcr.io/nemarorg/nemar-python-sif@${SIF_DIGEST}"
          cosign verify "ghcr.io/nemarorg/nemar-python-sif@${SIF_DIGEST}" \
            --certificate-identity-regexp "$SIGNING_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      - name: Write the digest record (cpu)
        if: matrix.flavor == 'cpu'
        env:
          SIF_DIGEST: ${{ steps.push-sif.outputs.digest }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 scripts/make_image_digests.py \
            --version "$VERSION" \
            --flavor cpu \
            --image-digest "$IMAGE_DIGEST" \
            --sif-digest "$SIF_DIGEST" \
            --sif-file nemar-python.sif \
            --smoke smoke-sif.json \
            --run-url "$RUN_URL" \
            --commit "$GITHUB_SHA" \
            --output "nemar-python-${VERSION}-cpu-digests.json"
          cat "nemar-python-${VERSION}-cpu-digests.json"

      # The CUDA flavor publishes no SIF and its record names none: the record is of the image digest,
      # its smoke document (the container form, run with no GPU visible) and the GPU architectures
      # torch lists.
      - name: Write the digest record (cuda)
        if: matrix.flavor == 'cuda'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 scripts/make_image_digests.py \
            --version "$VERSION" \
            --flavor cuda \
            --image-digest "$IMAGE_DIGEST" \
            --smoke smoke-container.json \
            --run-url "$RUN_URL" \
            --commit "$GITHUB_SHA" \
            --output "nemar-python-${VERSION}-cuda-digests.json"
          cat "nemar-python-${VERSION}-cuda-digests.json"

      # One artifact per flavor: a name may be used once per run.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nemar-python-digests-${{ matrix.flavor }}
          path: nemar-python-${{ env.VERSION }}-${{ matrix.flavor }}-digests.json
          if-no-files-found: error

  release:
    name: attach the digest record to the release
    needs: [publish, sign]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nemar-python-digests-*
          merge-multiple: true

      - name: Attach the files to the release of the tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          set -euo pipefail
          cpu="nemar-python-${VERSION}-cpu-digests.json"
          cuda="nemar-python-${VERSION}-cuda-digests.json"
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            cpu_digest="$(jq -r .image.digest "$cpu")"
            cuda_digest="$(jq -r .image.digest "$cuda")"
            gh release create "$TAG" --title "nemar-python ${VERSION} (cpu, cuda)" --notes "Runtime images ghcr.io/nemarorg/nemar-python@${cpu_digest} (cpu) and ghcr.io/nemarorg/nemar-python@${cuda_digest} (cuda). See docs/images.md for how to verify them."
          fi
          # No overwrite flag: a digest file is the record of a release and is never replaced. A re-run
          # after a partial upload skips a file that is already attached and byte for byte the same
          # (compared by SHA-256), uploads the one that is missing, and fails on a file that is
          # attached and differs.
          for file in "$cpu" "$cuda"; do
            attached="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
            if grep -Fxq -- "$file" <<< "$attached"; then
              remote="$(gh release download "$TAG" --pattern "$file" --output - | sha256sum | cut -d' ' -f1)"
              mine="$(sha256sum "$file" | cut -d' ' -f1)"
              if [ "$remote" != "$mine" ]; then
                echo "::error::${file} is already attached to ${TAG} and differs from this run's file: it is never replaced"
                exit 1
              fi
              echo "${file} is already attached and identical: nothing to upload"
              continue
            fi
            gh release upload "$TAG" "$file"
          done
