name: nemar-cli drift (advisory)

# Says, without failing, when nemar-cli has moved past one of the commits this repository pins, or past a
# contract it copies. Each job only warns (`continue-on-error`), so no check here is ever required.
# Only a change to a pin or a copied contract, or time, changes the answer, so the workflow starts on a pull
# request that touches one of them, on a push to `dev`, and by hand. It has no schedule: a scheduled run
# is the default branch's copy, which has none of this until a release, and nobody reads a green one.

on:
  pull_request:
    paths:
      - ".github/workflows/nemar-cli-drift.yml"
      - "tests/contract/**"
      - "launcher/schema/**"
      - "runner/schema/**"
      - "observer/schema/**"
      - "tests/observer/fixtures/**"
      - "deploy/tapis/**"
      - "recipes/nemar_process/common/contract/**"
  push:
    branches: ["dev"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nemar-cli-latest:
    # Advisory: says, without failing, when nemar-cli's `dev` has a launch schema newer than the pin.
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nemarOrg/nemar-cli
          ref: dev
          path: .nemar-cli-dev
          sparse-checkout: shared/contract
          fetch-depth: 1
      - run: |
          theirs=.nemar-cli-dev/shared/contract/compute-launch.schema.json
          if [ ! -f "$theirs" ]; then
            echo "::warning title=nemar-cli dev has no launch schema yet::The pin in tests/contract/nemar-cli-pin.json still points at a commit of the epic branch."
          elif cmp -s "$theirs" launcher/schema/launch-spec.v1.json; then
            echo "launcher/schema/launch-spec.v1.json equals nemar-cli dev"
          else
            echo "::warning title=launch schema differs from nemar-cli dev::Bump the pin (docs/contracts.md) once the change is reviewed."
          fi

  nemar-cli-observation-latest:
    # Advisory: says, without failing, when nemar-cli's compute epic branch has changed the observation
    # schema or the observer fixtures since the commit the pin `tests/contract/nemar-cli-observation-pin.json`
    # names, so the copies here are moved deliberately.
    runs-on: ubuntu-24.04
    continue-on-error: true
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare the pin with the epic branch
        run: |
          set -euo pipefail
          ref=$(python3 -c 'import json; print(json.load(open("tests/contract/nemar-cli-observation-pin.json"))["ref"])')
          branch=feature/issue-2005-epic-compute-core
          # The API call comes first and on its own: a failure of it (the pinned commit is not on that
          # branch yet, the branch is gone once the epic merges, or the commit is unknown) must not read
          # as "nothing changed".
          if ! files=$(gh api "repos/nemarOrg/nemar-cli/compare/${ref}...${branch}" --jq '.files[].filename'); then
            echo "::warning title=nemar-cli's observation schema could not be compared with the pin::The comparison of ${ref:0:12} with ${branch} failed, so nothing is known about changes; check by hand, or move the branch name in this job."
            exit 0
          fi
          changed=$(printf '%s\n' "$files" | grep -E '^(shared/contract/compute-observation\.schema\.json$|test/fixtures/compute-observation/)' || true)
          if [ -n "$changed" ]; then
            echo "::warning title=nemar-cli's observation schema or fixtures moved past the pin::Changed since ${ref:0:12}: $(echo "$changed" | tr '\n' ' '). Copy them (docs/contracts.md, Bumping the pin), then bump the pin in tests/contract/nemar-cli-observation-pin.json."
          else
            echo "the observation schema and fixtures are unchanged since the pin"
          fi

  nemar-cli-tapis-latest:
    # Advisory: says, without failing, when nemar-cli's compute epic branch has changed the files the
    # Tapis definitions are compared with (the client and the contract) since the commit the pin
    # `tests/contract/nemar-cli-tapis-pin.json` names, so the agreement test is moved deliberately.
    runs-on: ubuntu-24.04
    continue-on-error: true
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare the pin with the epic branch
        run: |
          set -euo pipefail
          ref=$(python3 -c 'import json; print(json.load(open("tests/contract/nemar-cli-tapis-pin.json"))["ref"])')
          branch=feature/issue-2005-epic-compute-core
          # The API call comes first and on its own: a failure of it (the branch is gone once the epic
          # merges, or the commit is unknown) must not read as "nothing changed".
          if ! files=$(gh api "repos/nemarOrg/nemar-cli/compare/${ref}...${branch}" --jq '.files[].filename'); then
            echo "::warning title=nemar-cli's Tapis client could not be compared with the pin::The comparison of ${ref:0:12} with ${branch} failed, so nothing is known about changes; check by hand, or move the branch name in this job."
            exit 0
          fi
          changed=$(printf '%s\n' "$files" | grep -E '^(backend/src/services/tapis/|shared/contract/compute\.ts$)' || true)
          if [ -n "$changed" ]; then
            echo "::warning title=nemar-cli's Tapis client moved past the pin::Changed since ${ref:0:12}: $(echo "$changed" | tr '\n' ' '). Read them, update the agreement test if the request changed, then bump the pin in tests/contract/nemar-cli-tapis-pin.json."
          else
            echo "the Tapis client and contract files are unchanged since the pin"
          fi

  nemar-cli-progress-latest:
    # Advisory: says, without failing, when nemar-cli's pipeline progress epic branch has changed the live
    # progress contract (the schema, the counting vectors and rules, the recipe checkpoint maps, the
    # runner schema that carries it) or a file pinned beside it (the plugin manifest schema and vectors,
    # the neuroschema bundle, views registry and the three view vectors the views writer's tests replay,
    # the naming port and its vectors, the standalone contracts) since the commit the pin
    # `tests/contract/nemar-cli-progress-pin.json` names, so the copies here are moved deliberately.
    # Move the branch name to `dev` once the epic merges.
    runs-on: ubuntu-24.04
    continue-on-error: true
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare the pin with the epic branch
        run: |
          set -euo pipefail
          ref=$(python3 -c 'import json; print(json.load(open("tests/contract/nemar-cli-progress-pin.json"))["ref"])')
          branch=feature/issue-2324-epic-pipeline-progress
          # The API call comes first and on its own: a failure of it (the branch is gone once the epic
          # merges, or the commit is unknown) must not read as "nothing changed".
          if ! files=$(gh api "repos/nemarOrg/nemar-cli/compare/${ref}...${branch}" --jq '.files[].filename'); then
            echo "::warning title=nemar-cli's progress contract could not be compared with the pin::The comparison of ${ref:0:12} with ${branch} failed, so nothing is known about changes; check by hand, or move the branch name in this job."
            exit 0
          fi
          changed=$(printf '%s\n' "$files" | grep -E '^(shared/contract/compute-progress(\.schema\.json|-vectors\.json|\.ts)$|shared/contract/compute-runner\.schema\.json$|shared/compute-checkpoints\.ts$|shared/compute-recipes\.ts$|shared/compute-naming\.ts$|shared/contract/compute-naming-vectors\.json$|shared/contract/plugin-manifest(\.schema\.json|-vectors\.json|\.ts)$|shared/contract/neuroschema/dataset\.bundle\.json$|shared/contract/neuroschema/views/registry\.json$|shared/contract/neuroschema/views/vectors/(record-checks|preset-checks|view-digest|ic-activity)\.v1\.json$|shared/contract/compute-(local-launch|recipe-progress|results-report)\.schema\.json$)' || true)
          if [ -n "$changed" ]; then
            echo "::warning title=nemar-cli's progress contract moved past the pin::Changed since ${ref:0:12}: $(echo "$changed" | tr '\n' ' '). Copy them (docs/contracts.md, The live progress contract, Bumping the progress pin), then bump tests/contract/nemar-cli-progress-pin.json and tests/contract/nemar-cli-runner-pin.json to the same ref."
          else
            echo "the progress contract files are unchanged since the pin"
          fi
