target-version = "py312"
line-length = 100
extend-exclude = ["tests/fixtures"]

# The launcher and the observer run on a compute node under whatever Python the host has; the
# floor is 3.9. The launcher tests run on 3.9 too, so they keep to the same syntax.
[per-file-target-version]
"launcher/**" = "py39"
"observer/**" = "py39"
"tests/launcher/**" = "py39"
"tests/standin/**" = "py39"

[lint]
select = [
    "E", "W", "F", "I", "UP", "B", "SIM", "C4", "PT", "RUF", "S", "T20", "PTH", "N", "A", "BLE",
    "TRY", "PIE", "RET", "ARG",
]
ignore = [
    "TRY003",  # long messages in exceptions are fine here
    "S101",    # asserts are the point of tests
    "S603",    # subprocess without shell is how the launcher runs the container
    "S607",    # the container runtime is found on PATH by design
]

[lint.per-file-ignores]
"tests/**" = ["S", "ARG", "PT011", "T201"]
"scripts/**" = ["T201"]
# The launcher prints its own diagnostics to stderr on purpose.
"launcher/**" = ["T201"]

[format]
quote-style = "double"
