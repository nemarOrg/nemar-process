target-version = "py312"
line-length = 100
extend-exclude = ["tests/fixtures", ".nemar-cli", ".nemar-cli-dev", ".nemar-cli-tapis"]

# The launcher and the observer run on a compute node under whatever Python the host has; the
# floor is 3.9. The launcher tests run on 3.9 too, so they keep to the same syntax.
[per-file-target-version]
"launcher/**" = "py39"
"observer/**" = "py39"
"runner/**" = "py39"
"tests/launcher/**" = "py39"
"tests/observer/**" = "py39"
"tests/runner/**" = "py39"
"tests/observer_support.py" = "py39"
"tests/standin/**" = "py39"

[lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "PT", "RUF", "S", "T20", "BLE", "PIE", "RET"]
ignore = [
    "E501",    # the formatter wraps code; long prose lines in docstrings and strings are fine
    "UP032",   # str.format is used throughout; both forms are valid on 3.9
    "S101",    # asserts are the point of tests
    "S603",    # subprocess without shell is how the launcher runs the container
    "S607",    # the container runtime is found on PATH by design
    "S310",    # urllib is opened only on https/http URLs the specification and manifests name
]

[lint.per-file-ignores]
"tests/**" = ["S", "ARG", "PT011", "T201"]
"scripts/**" = ["T201"]
# The launcher and the observer print their own diagnostics on purpose, and so does the recipe
# command: one line per recording on standard error and one JSON line of counts on standard output.
# (The pre-commit hook runs with --unsafe-fixes, which deletes a print the rule flags.)
"launcher/**" = ["T201"]
"observer/**" = ["T201"]
"runner/**" = ["T201"]
"recipes/nemar_process/cli.py" = ["T201"]

[format]
quote-style = "double"
